[project]
name = "avatar-splats"
version = "0.1.0"
description = "Re-posable Gaussian splat avatars from turntable video, bound to an Anny body and a FLAME head."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "av>=14",
    "gsplat>=1.5.3",
    "mediapipe>=0.10",
    "numpy>=2",
    "pillow>=11",
    "pyyaml>=6",
    "scipy>=1.14",
    "torch>=2.15",
    "torchvision>=0.29",
    "transformers>=4.57",
]

[project.scripts]
avatar-splats = "avatar_splats.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=4",
    "pytest>=8",
    "ruff>=0.8",
]
notebooks = [
    "ipykernel>=6",
    "jupyterlab>=4",
    "matplotlib>=3.9",
]

[tool.uv]
default-groups = ["dev", "notebooks"]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu132" }
torchvision = { index = "pytorch-cu132" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
