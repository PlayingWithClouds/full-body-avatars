version: "3"

vars:
  # Another capture: go-task fit CONFIG=configs/performer-2.yaml
  CONFIG: configs/default.yaml

tasks:
  setup:
    desc: Install dependencies and the git hooks
    cmds:
      - uv sync
      - uv run pre-commit install

  notebook:
    desc: Open JupyterLab on the notebooks
    cmds:
      - uv run jupyter lab notebooks

  test:
    desc: Run the tests
    cmds:
      - uv run pytest {{.CLI_ARGS}}

  lint:
    desc: Check style and formatting
    cmds:
      - uv run ruff check
      - uv run ruff format --check

  format:
    desc: Fix style and formatting
    cmds:
      - uv run ruff check --fix
      - uv run ruff format

  check:
    desc: Lint and test, as before a commit
    cmds:
      - task: lint
      - task: test

  inspect:
    desc: Describe the capture videos
    cmds:
      - uv run avatar-splats --config {{.CONFIG}} inspect

  preprocess:
    desc: "Preprocess the capture videos (all, or name them: task preprocess -- body)"
    cmds:
      - uv run avatar-splats --config {{.CONFIG}} preprocess {{.CLI_ARGS}}

  fit:
    desc: Fit the body and head models and build the avatar's mesh
    cmds:
      - uv run avatar-splats --config {{.CONFIG}} fit

  train:
    desc: Train the avatar's Gaussians
    cmds:
      - uv run avatar-splats --config {{.CONFIG}} train

  export:
    desc: Write the avatar file for the game runtime
    cmds:
      - uv run avatar-splats --config {{.CONFIG}} export

  faces:
    desc: "Convert a video's face landmarks to the avatar's face (default head_expressions: task faces -- body)"
    cmds:
      - uv run avatar-splats --config {{.CONFIG}} faces {{.CLI_ARGS}}

  motion:
    desc: "Extract the motion of the people in a video: task motion -- path/to/video.mp4"
    cmds:
      - uv run avatar-splats --config {{.CONFIG}} motion {{.CLI_ARGS}}

  pipeline:
    desc: Run every stage, from the videos to the avatar file
    cmds:
      - task: preprocess
      - task: fit
      - task: train
      - task: export

  viewer:
    desc: View the exported avatar in the browser (http://localhost:5173)
    dir: viewer
    cmds:
      - bun install
      - ln -sf {{.ROOT_DIR}}/outputs/export/performer.avatar static/performer.avatar
      - ln -sfn {{.ROOT_DIR}}/outputs/motion static/motion
      - mkdir -p {{.ROOT_DIR}}/outputs/faces
      - ln -sfn {{.ROOT_DIR}}/outputs/faces static/faces
      - bun run dev
